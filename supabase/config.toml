# Supabase CLI config. Ref project ada di `supabase link` (disimpan di
# supabase/.temp/, gitignored). Deploy: `supabase functions deploy admin-users`.

project_id = "coaching-math"

# Dipanggil dari browser -> preflight CORS OPTIONS nggak bawa JWT, jadi
# verify_jwt dimatikan (tiap function cek auth-nya sendiri).
[functions.admin-users]
verify_jwt = false

[functions.quiz-submit]
verify_jwt = false
